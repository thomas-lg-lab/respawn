# CI: the project's checks, then the image, so nothing is published that did not pass them.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # release-drafter.yml dispatches this workflow on the tag a published release creates.
  workflow_dispatch:

permissions: {}

# A newer push to a PR cancels its run; main and tags never cancel, a publish must not stop mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The backend: formatting, the build (warnings are errors in Release) and the tests, in the same SDK
  # image as the Dockerfile, against a real PostgreSQL.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb
    services:
      db:
        image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: respawn
          POSTGRES_PASSWORD: respawn
          POSTGRES_DB: respawn
        options: >-
          --health-cmd "pg_isready -U respawn"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # The base name of the databases the test projects create, one each (respawn_accounts_test, ...):
      # they refuse a name that does not end in _test.
      RESPAWN_TEST_DATABASE_URL: postgresql://respawn:respawn@db:5432/respawn_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --locked-mode fails when packages.lock.json is out of date: a dependency cannot change without
      # its reviewed lock file.
      - name: Restore the locked dependencies
        run: dotnet restore Respawn.slnx --locked-mode
      - name: Formatting
        run: dotnet format Respawn.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Respawn.slnx --no-restore --configuration Release
      - name: Tests
        run: dotnet test Respawn.slnx --no-build --configuration Release
      # The front's types are generated from frontend/openapi.json: it must be, byte for byte, the
      # description this build serves. The app starts with no database, which is all this needs.
      - name: The committed API description is current
        run: |
          (cd backend/Respawn.Host/bin/Release/net10.0 && ASPNETCORE_HTTP_PORTS=5080 dotnet Respawn.Host.dll) &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/api/v1/openapi.json -o /tmp/openapi.json; then break; fi
            sleep 1
          done
          if ! diff -u frontend/openapi.json /tmp/openapi.json; then
            echo "::error file=frontend/openapi.json::The API description changed: save GET /api/v1/openapi.json to frontend/openapi.json, run 'npm run gen:api' in frontend/ and commit both."
            exit 1
          fi

  # The front: formatting, lint, the generated API types, the production build and the tests.
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: this workflow also publishes the image, and a cache written by one run
          # and restored by a publishing one is a way in. The install takes a few seconds without it.
          package-manager-cache: false
      # npm ci fails when package-lock.json does not match package.json: a dependency cannot change
      # without its reviewed lock file.
      - name: Install the locked dependencies
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      # The other half of the check above: the types are what openapi-typescript makes of the
      # committed description, not a file edited by hand or left behind by an older one.
      - name: The generated API types are current
        run: |
          npm run gen:api
          if ! git diff --exit-code -- packages/data/src/lib/models/api-types.ts; then
            echo "::error file=frontend/packages/data/src/lib/models/api-types.ts::The API types are stale: run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi
      # The production build is the compile gate: it type-checks and bundles the app and every package.
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

  # Build, runtime contract test and Trivy gate on every PR; edge and sha-* from main; X.Y.Z and latest from a release
  # tag. The contract test starts the image as the cluster runs it: non-root, read-only root filesystem, no secret
  # and no database, and it must still answer /healthz. Then with a database that comes up late: /api/v1/config
  # answers 503 until it is there, and /api/v1/me stays closed to a forged Remote-User header.
  image:
    needs: [checks, frontend]
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write
    uses: thomas-lg-lab/.github/.github/workflows/container-image.yml@195c6b6a551cc72fa835669f1d48f26915c199de # v2.4.0
    with:
      contract-test: true
      contract-protected-path: /api/v1/me
      contract-database-path: /api/v1/config
