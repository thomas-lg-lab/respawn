# Local development: the app and its database. Not a production setup: the password below is a throwaway and
# the cookie is not marked Secure because the page is served over plain HTTP on localhost.
#   docker compose up --build        http://localhost:8080
#   docker compose up -d db          only the database, for the tests (CONTRIBUTING.md)
#   docker compose --profile tools up -d node sdk
#                                    the tools, kept running: the checks then go through
#                                    `docker compose exec` (CONTRIBUTING.md)
services:
  db:
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_USER: respawn
      POSTGRES_PASSWORD: respawn
      POSTGRES_DB: respawn
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respawn"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RESPAWN_DATABASE_URL: postgresql://respawn:respawn@db:5432/respawn
      RESPAWN_COOKIE_SECURE: "false"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"

  # The tools, kept running so that a check does not start from an empty container each time: the packages
  # stay installed and the build stays warm. They do nothing by themselves; `docker compose exec` runs in them.
  # They mount this checkout and write into it (bin/, obj/, the front's .angular and dist; node_modules is a
  # volume): one checkout, one set of tools (CONTRIBUTING.md).
  node:
    profiles: [tools]
    image: node:24.22.3-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    init: true
    command: ["sleep", "infinity"]
    working_dir: /web
    environment:
      # Where the dev server finds the API: the app of this file, by its service name.
      RESPAWN_API: http://app:8080
    volumes:
      - ./frontend:/web
      # The packages on a disk of the container's own, over the checkout's folder: read through a disk
      # shared from Windows or macOS, they are what a check spends most of its time on (CONTRIBUTING.md).
      - node-modules:/web/node_modules
      - npm-cache:/root/.npm
    ports:
      - "127.0.0.1:4200:4200"

  sdk:
    profiles: [tools]
    image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb
    init: true
    command: ["sleep", "infinity"]
    working_dir: /work
    depends_on:
      db:
        condition: service_healthy
    environment:
      RESPAWN_TEST_DATABASE_URL: postgresql://respawn:respawn@db:5432/respawn_test
    volumes:
      - .:/work
      - nuget-packages:/root/.nuget/packages

volumes:
  node-modules:
  npm-cache:
  nuget-packages:
