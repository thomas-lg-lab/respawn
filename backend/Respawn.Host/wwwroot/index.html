<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>respawn</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main>
      <h1>respawn</h1>
      <p id="status" role="status">Loading…</p>

      <section id="account" hidden>
        <p>Signed in as <strong id="name"></strong> <span id="role"></span></p>
        <p id="email"></p>
        <button id="logout" type="button">Sign out</button>
      </section>

      <form id="sign-in" hidden>
        <h2 id="form-title">Sign in</h2>
        <label id="display-name-field" hidden>Name <input name="display_name" autocomplete="name" maxlength="100"></label>
        <label>E-mail <input name="email" type="email" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" id="submit">Sign in</button>
        <button type="button" id="toggle" hidden>Create an account</button>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
