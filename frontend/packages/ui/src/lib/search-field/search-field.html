<!-- What stands before what is typed follows the character: a prompt in `pixel`, the
     magnifier in `plain`. -->
<span class="prompt" aria-hidden="true"></span>
<svg lucideSearch class="icon" [strokeWidth]="2" aria-hidden="true"></svg>
<input
  #control
  type="search"
  autocomplete="off"
  [attr.aria-label]="label()"
  [attr.role]="popup() ? 'combobox' : null"
  [attr.aria-autocomplete]="popup() ? 'list' : null"
  [attr.aria-controls]="popup() ?? null"
  [attr.aria-expanded]="popup() ? expanded() : null"
  [attr.aria-activedescendant]="active() ?? null"
  [placeholder]="placeholder()"
  [value]="value()"
  (input)="value.set(control.value)"
/>
<ng-content />
