<!-- Focused when "more genres" is pressed in the hero: it holds them all. -->
<section
  id="about"
  tabindex="-1"
  class="flex scroll-mt-20 flex-col gap-3 rounded-card border border-line bg-surface px-4 py-4.5 outline-none wide:px-6 wide:py-5"
  data-about
  *transloco="let t; prefix: 'game.about'"
>
  <h2 class="type-card-title">{{ t('title') }}</h2>
  @if (summary(); as said) {
    <p class="max-w-[46em] whitespace-pre-line" lang="en" data-summary>{{ said }}</p>
  }
  @if (tags().length) {
    <rs-game-tags [tags]="tags()" [label]="t('tags')" />
  }
  @if (url(); as address) {
    <a
      class="inline-flex items-center gap-0.5 self-start type-caption text-muted hover:text-text hover:underline touch-only:min-h-touch"
      target="_blank"
      rel="noopener noreferrer"
      data-about-source
      [href]="address"
    >
      {{ t('source') }}
      <svg lucideArrowUpRight class="size-3.5" [strokeWidth]="2" aria-hidden="true"></svg>
    </a>
  }
</section>
