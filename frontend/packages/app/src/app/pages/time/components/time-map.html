<div
  #drawing
  class="relative h-125 overflow-hidden rounded-card bg-bg wide:h-140"
  role="group"
  data-time-map
  *transloco="let t; prefix: 'time'"
  [attr.aria-label]="t('map')"
>
  @for (tile of placed(); track tile.item.id) {
    @let name =
      tile.others
        ? t(tile.others.one ? 'othersOne' : 'othersMany', { count: tile.others.count })
        : (tile.item.kind === 'game' && tile.item.game.name) || t('unnamed');
    @let time = t('playtime.' + tile.time.key, { count: tile.time.count });
    <!-- The gap between two tiles is one side of each, and a tile keeps two pixels at
         least: the smallest share still shows its colour. -->
    <button
      type="button"
      class="absolute flex min-h-0.5 min-w-0.5 flex-col items-start justify-end gap-0.5 overflow-hidden border-r-2 border-b-2 border-bg px-3 py-2 text-left hover:brightness-110 focus-visible:-outline-offset-4 aria-pressed:shadow-[inset_0_0_0_4px_currentColor]"
      [class.bg-surface-2]="tile.others"
      [class.text-text]="tile.others"
      [class.bg-recency-1]="tile.item.kind === 'game' && tile.item.recency === 1"
      [class.text-on-recency-1]="tile.item.kind === 'game' && tile.item.recency === 1"
      [class.bg-recency-2]="tile.item.kind === 'game' && tile.item.recency === 2"
      [class.text-on-recency-2]="tile.item.kind === 'game' && tile.item.recency === 2"
      [class.bg-recency-3]="tile.item.kind === 'game' && tile.item.recency === 3"
      [class.text-on-recency-3]="tile.item.kind === 'game' && tile.item.recency === 3"
      [class.bg-recency-4]="tile.item.kind === 'game' && tile.item.recency === 4"
      [class.text-on-recency-4]="tile.item.kind === 'game' && tile.item.recency === 4"
      [style.left.%]="tile.x"
      [style.top.%]="tile.y"
      [style.width.%]="tile.width"
      [style.height.%]="tile.height"
      [attr.aria-pressed]="tile.item.id === selected()"
      [attr.aria-label]="name + ', ' + time"
      [attr.data-tile]="tile.item.id"
      [attr.data-recency]="tile.item.kind === 'game' ? tile.item.recency : null"
      (click)="picked.emit(tile.item.id)"
    >
      @if (tile.named) {
        <span
          class="max-w-full"
          [class.line-clamp-2]="tile.wraps"
          [class.truncate]="!tile.wraps"
          [class.type-card-title]="!tile.large"
          [class.type-figure]="tile.large"
          aria-hidden="true"
          data-tile-name
          >{{ name }}</span
        >
      }
      @if (tile.timed) {
        <span class="type-caption font-semibold tabular-nums" aria-hidden="true" data-tile-time>{{
          time
        }}</span>
      }
    </button>
  }
</div>
