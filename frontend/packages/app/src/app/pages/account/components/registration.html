<rs-card class="flex flex-col gap-4" data-registration *transloco="let t">
  <div class="flex flex-wrap items-start justify-between gap-x-4 gap-y-3">
    <div class="flex min-w-0 flex-col gap-0.5">
      <h3 class="type-card-title" data-registration-state>
        {{ t(open() ? 'account.registration.open' : 'account.registration.closed') }}
      </h3>
      <p class="max-w-[44em] text-muted">
        {{ t(open() ? 'account.registration.openText' : 'account.registration.closedText') }}
      </p>
    </div>
    @if (!confirming()) {
      <button
        rsButton
        type="button"
        data-registration-change
        [disabled]="busy()"
        (click)="open() ? changed.emit(false) : confirm(true)"
      >
        {{ t(open() ? 'account.registration.close' : 'account.registration.openIt') }}
      </button>
    }
  </div>
  @if (confirming()) {
    <p class="max-w-[44em]" role="alert" data-registration-warning>
      {{ t('account.registration.warning') }}
    </p>
    <div class="flex flex-wrap gap-2">
      <button rsButton variant="primary" type="button" data-registration-confirm (click)="openIt()">
        {{ t('account.registration.confirm') }}
      </button>
      <button rsButton type="button" data-registration-cancel (click)="confirm(false)">
        {{ t('account.registration.cancel') }}
      </button>
    </div>
  }
  @if (failure(); as key) {
    <rs-banner tone="warn" role="alert" data-registration-failure>{{ t(key) }}</rs-banner>
  }
</rs-card>
