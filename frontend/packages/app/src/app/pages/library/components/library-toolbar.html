<div class="flex flex-col gap-3" *transloco="let t; prefix: 'library'">
  <!-- The filters, a row of words on a rule. On a phone the row scrolls rather than wraps, with
       no bar drawn over the rule: the word cut at the edge says there is more. -->
  <div
    class="flex [scrollbar-width:none] gap-5.5 overflow-x-auto border-b border-line"
    role="group"
    [attr.aria-label]="t('filter.label')"
  >
    @for (choice of filters(); track choice.id) {
      <button
        rsPill
        variant="line"
        [pressed]="filter() === choice.id"
        [attr.data-filter]="choice.id"
        (click)="filterPicked.emit(choice.id)"
      >
        {{ t('filter.' + choice.id) }}
        <span class="ms-1.5 font-normal text-muted tabular-nums">{{ choice.count }}</span>
      </button>
    }
  </div>
  <!-- The title the header's search asked for, with the way back to every game; the menus of
       genres, themes, the stores' tags and lengths, then what they keep as chips, each with its way off; then how
       the games are shown and their order. -->
  <div class="flex min-h-touch flex-wrap items-center gap-x-4 gap-y-2">
    @if (search()) {
      <p class="min-w-0 font-medium wrap-anywhere" role="status" data-searched>
        {{ t('searched', { title: search() }) }}
      </p>
      <button rsButton type="button" data-search-clear (click)="searchCleared.emit()">
        {{ t('clearSearch') }}
      </button>
    }
    <div
      class="relative flex w-full flex-wrap items-center gap-2 wide:w-auto"
      role="group"
      [attr.aria-label]="t('filters.label')"
    >
      <rs-filter-menu
        kind="genres"
        [choices]="genreChoices()"
        [shown]="listed()"
        (toggled)="tagToggled.emit($event)"
        (cleared)="tagsCleared.emit('genres')"
      />
      <rs-filter-menu
        kind="themes"
        [choices]="themeChoices()"
        [shown]="listed()"
        (toggled)="tagToggled.emit($event)"
        (cleared)="tagsCleared.emit('themes')"
      />
      <rs-filter-menu
        kind="tags"
        [choices]="storeTagChoices()"
        [shown]="listed()"
        (toggled)="storeTagToggled.emit($event)"
        (cleared)="storeTagsCleared.emit()"
      />
      <rs-filter-menu
        kind="lengths"
        [choices]="lengthChoices()"
        [shown]="listed()"
        (toggled)="lengthToggled.emit($event)"
        (cleared)="lengthsDropped.emit(allLengths)"
      />
    </div>
    @if (chips().length) {
      <ul class="flex flex-wrap gap-2">
        @for (chip of chips(); track chip.key) {
          <li>
            <button
              rsButton
              type="button"
              class="min-h-9 gap-1.5 bg-surface ps-3.5 pe-2.5"
              [attr.data-chip]="chip.key"
              [attr.title]="chip.full"
              [aria-label]="t('filters.remove', { label: chip.full ?? t(chip.label) })"
              (click)="drop(chip)"
            >
              {{ chip.full ? chip.label : t(chip.label) }}
              <svg lucideX class="size-3.5" [strokeWidth]="2.2" aria-hidden="true"></svg>
            </button>
          </li>
        }
      </ul>
    }
    <rs-pill-group segmented class="ms-auto" [label]="t('view.label')">
      @for (choice of views; track choice) {
        <button
          rsPill
          [pressed]="view() === choice"
          [attr.data-view]="choice"
          (click)="viewPicked.emit(choice)"
        >
          {{ t('view.' + choice) }}
        </button>
      }
    </rs-pill-group>
    <label class="flex items-center gap-1 type-control text-muted">
      {{ t('sort.label') }}
      <select rsSelect quiet data-sort (change)="pickSort($event)">
        @for (choice of sorts; track choice) {
          <option [value]="choice" [selected]="sort() === choice">
            {{ t('sort.' + choice) }}
          </option>
        }
      </select>
    </label>
  </div>
</div>
