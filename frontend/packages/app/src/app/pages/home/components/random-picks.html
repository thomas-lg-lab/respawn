<rs-card class="flex flex-col gap-3" data-picks *transloco="let t">
  <div class="flex min-h-touch items-center justify-between gap-3">
    <h2 class="type-card-title">{{ t('home.picks.title') }}</h2>
    @if (more()) {
      <button rsButton type="button" data-reroll (click)="reroll.emit()">
        {{ t('home.picks.reroll') }}
      </button>
    }
  </div>
  <ul class="flex flex-col gap-0.5">
    @for (pick of picks(); track pick.id) {
      <li
        class="relative -mx-1.5 flex items-center gap-3 rounded-thumb px-1.5 py-1 transition-colors duration-hover hover:bg-surface-2"
        [attr.data-game]="pick.id"
      >
        <rs-cover
          class="w-7.5 shrink-0 rounded-thumb"
          aria-hidden="true"
          [hue]="pick.hue"
          [src]="pick.cover"
        />
        <a
          class="min-w-0 truncate font-semibold after:absolute after:inset-0 after:rounded-thumb focus-visible:outline-none focus-visible:after:outline-2 focus-visible:after:outline-focus"
          data-name
          [routerLink]="gamePage(pick.id)"
          [state]="from"
          >{{ pick.name ?? t('game.unnamed') }}</a
        >
      </li>
    }
  </ul>
</rs-card>
