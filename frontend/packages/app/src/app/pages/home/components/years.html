<rs-card class="flex flex-col gap-4" data-years *transloco="let t; prefix: 'home'">
  <h2 class="type-card-title">{{ t('years.title') }}</h2>
  <rs-column-chart>
    @for (column of columns(); track column.year) {
      <rs-chart-column
        [attr.data-year]="column.year"
        [label]="column.label"
        [value]="column.seconds"
        [max]="scale()"
        [open]="column.open"
        >{{ t('time.' + column.time.key, { count: column.time.count }) }}</rs-chart-column
      >
    }
  </rs-column-chart>
  <p class="type-caption text-muted" data-years-since>
    {{ t('years.since', { date: sinceDate() }) }}
  </p>
</rs-card>
