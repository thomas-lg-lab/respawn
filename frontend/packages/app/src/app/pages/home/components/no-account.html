<section
  class="flex flex-col items-center gap-4.5 py-10 text-center"
  *transloco="let t; prefix: 'home.noAccount'"
>
  <!-- Three covers to come: a drawing. -->
  <div class="flex items-end gap-2.5" aria-hidden="true">
    <span class="h-24 w-16 rounded-field border-2 border-dashed border-line"></span>
    <span class="h-30 w-20 rounded-field border-2 border-dashed border-muted"></span>
    <span class="h-24 w-16 rounded-field border-2 border-dashed border-line"></span>
  </div>
  <p rsLabel>{{ t('label') }}</p>
  <h1 class="type-page-title">{{ t('title') }}</h1>
  <p class="max-w-[34em] text-muted">{{ t('text') }}</p>
  <a rsButton variant="primary" data-link-steam [href]="address()">
    <svg lucideLink class="size-icon" [strokeWidth]="2" aria-hidden="true"></svg>
    {{ t('link') }}
  </a>
  <p class="type-caption text-muted">{{ t('note') }}</p>
</section>
