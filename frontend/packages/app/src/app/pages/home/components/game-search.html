<form
  class="flex items-center gap-2.5"
  role="search"
  data-search
  (submit)="submit($event)"
  *transloco="let t; prefix: 'home.search'"
>
  <rs-search-field
    class="min-w-0 flex-1"
    [label]="t('label')"
    [placeholder]="t('placeholder')"
    [(value)]="typed"
  />
  <button rsButton type="submit">{{ t('submit') }}</button>
</form>
