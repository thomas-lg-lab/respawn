<!-- A field beside the tabs where the header has room for it (`roomy:`). Under that it is a
     button, and the field unfolds over the whole header when asked for, then folds back: it and
     its suggestions are placed against the header. -->
<div
  class="roomy:relative"
  role="search"
  data-search
  (focusin)="entered($event)"
  (focusout)="left($event)"
  (keydown)="key($event)"
  *transloco="let t; prefix: 'search'"
>
  <!-- Out of reach while the field stands over it. -->
  <button
    #opener
    type="button"
    class="flex size-touch items-center justify-center rounded-thumb roomy:hidden"
    data-search-open
    [class.invisible]="unfolded()"
    [aria-label]="t('open')"
    (click)="unfold()"
  >
    <svg lucideSearch class="size-5" [strokeWidth]="2" aria-hidden="true"></svg>
  </button>

  <!-- Folded, it is still there, cut down to nothing from the right and out of reach: it
       unfolds from the side its button is on, and folds back the same way. It is within reach
       as soon as it unfolds, for the field to take the focus at once, and out of reach only
       once folded back: the delay is on that way alone. A press on its own margin keeps the
       focus where it is. -->
  <div
    class="absolute inset-0 z-10 flex items-center gap-1 bg-bg px-4 [transition:clip-path_var(--rs-duration-overlay)_ease-out] data-[unfolded=false]:invisible data-[unfolded=false]:[transition:clip-path_var(--rs-duration-overlay)_ease-out,visibility_0s_linear_var(--rs-duration-overlay)] data-[unfolded=false]:[clip-path:inset(0_0_0_100%)] data-[unfolded=true]:[clip-path:inset(0)] wide:px-10 roomy:static roomy:bg-transparent roomy:px-0 roomy:transition-none roomy:data-[unfolded=false]:visible roomy:data-[unfolded=false]:[clip-path:none] roomy:data-[unfolded=true]:[clip-path:none]"
    data-search-bar
    [attr.data-unfolded]="unfolded()"
    (mousedown)="pressed($event)"
  >
    <!-- A container: the hint at the shortcut is only drawn when the field has room for it. -->
    <rs-search-field
      class="@container min-w-0 flex-1"
      [label]="t('label')"
      [placeholder]="t('placeholder')"
      [popup]="listId"
      [expanded]="listed()"
      [active]="activeId()"
      [(value)]="typed"
    >
      @if (typed()) {
        <button
          type="button"
          class="flex size-8 shrink-0 items-center justify-center rounded-thumb text-muted transition-colors duration-hover hover:bg-surface-2 hover:text-text"
          data-search-clear
          [aria-label]="t('clear')"
          (mousedown)="$event.preventDefault()"
          (click)="clear()"
        >
          <svg lucideX class="size-4" [strokeWidth]="2" aria-hidden="true"></svg>
        </button>
      } @else {
        <kbd
          class="me-1 hidden shrink-0 rounded-thumb border border-control-line px-1.5 py-0.5 type-caption font-medium whitespace-nowrap text-muted roomy:@min-[15rem]:inline"
          aria-hidden="true"
          >{{ t(apple ? 'shortcutApple' : 'shortcut') }}</kbd
        >
      }
    </rs-search-field>
    <button
      type="button"
      class="min-h-touch shrink-0 rounded-thumb px-2 type-control font-semibold roomy:hidden"
      data-search-close
      (mousedown)="$event.preventDefault()"
      (click)="close()"
    >
      {{ t('close') }}
    </button>
  </div>

  @if (shown() || failed()) {
    <!-- Under the header: over its whole width on a phone, within its margins from `wide:`, and
         under the field where there is one: as wide as it at least, and wide enough for a title
         when it is short. A press here must not
         take the focus off the field: the search would close under it. -->
    <div
      class="absolute inset-x-0 top-full z-10 overflow-hidden border-b border-control-line bg-surface shadow-overlay animate-overlay-in wide:inset-x-10 wide:rounded-thumb wide:border roomy:right-0 roomy:left-auto roomy:mt-2 roomy:w-88 roomy:max-w-[calc(100cqw-2rem)] roomy:min-w-full"
      data-search-panel
      (mousedown)="$event.preventDefault()"
    >
      @if (failed()) {
        <p class="px-3 py-3.5 text-muted" role="status" data-search-unreadable>
          {{ t('unreadable') }}
        </p>
      } @else if (suggestions().length) {
        <div class="p-1" role="listbox" [id]="listId" [attr.aria-label]="t('suggestions')">
          @for (row of suggestions(); track row.id; let index = $index) {
            <button
              rsButton
              variant="row"
              type="button"
              role="option"
              tabindex="-1"
              class="group relative"
              data-suggestion
              [id]="row.id"
              [attr.aria-selected]="index === active()"
              (click)="ask(row.title)"
            >
              <!-- The one the arrow keys are on has the field's prompt before it, in the row's
                   margin so that nothing moves; the plain character has no prompt to draw. -->
              <span
                class="pointer-events-none absolute inset-y-0 start-0.5 hidden items-center font-label text-accent-text label-prompt group-aria-selected:flex"
                aria-hidden="true"
              ></span>
              <rs-cover class="w-6 shrink-0 rounded-thumb" aria-hidden="true" [hue]="row.hue" />
              <span class="min-w-0 truncate" data-title
                >{{ row.cut.before
                }}<mark class="bg-transparent font-semibold text-accent-text">{{
                  row.cut.found
                }}</mark
                >{{ row.cut.after }}</span
              >
              <span
                class="ms-auto type-caption whitespace-nowrap text-muted tabular-nums"
                data-time
              >
                @if (row.time === 'never' || row.time === 'unknown') {
                  {{ t(row.time) }}
                } @else {
                  {{ t(row.time.key, { count: row.time.count }) }}
                }
              </span>
            </button>
          }
        </div>
        <div class="border-t border-line p-1">
          <button
            rsButton
            variant="row"
            type="button"
            class="font-label"
            data-search-all
            (click)="ask(asked())"
          >
            {{ t(all().one ? 'seeOne' : 'seeMany', { count: all().count }) }}
          </button>
        </div>
      } @else {
        <p class="px-3 py-3.5 text-muted" role="status" data-search-none>
          {{ t('none', { title: asked() }) }}
        </p>
      }
    </div>
  }
</div>
