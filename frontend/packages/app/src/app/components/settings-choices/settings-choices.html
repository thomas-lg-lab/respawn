<ng-container *transloco="let t; prefix: 'settings'">
  <rs-pill-group segmented [label]="t('language')">
    @for (choice of languages; track choice) {
      <!-- A language is named in itself, so its name is read in that language. -->
      <button
        rsPill
        variant="segment"
        [pressed]="choice === language()"
        [attr.data-language-choice]="choice"
        [attr.lang]="choice"
        (click)="languagePicked.emit(choice)"
      >
        {{ t('languages.' + choice) }}
      </button>
    }
  </rs-pill-group>

  <rs-pill-group segmented [label]="t('theme')">
    @for (choice of themes; track choice) {
      <button
        rsPill
        variant="segment"
        [pressed]="choice === theme()"
        [attr.data-theme-choice]="choice"
        (click)="themePicked.emit(choice)"
      >
        {{ t('themes.' + choice) }}
      </button>
    }
  </rs-pill-group>

  <rs-pill-group segmented [label]="t('character')">
    @for (choice of characters; track choice) {
      <button
        rsPill
        variant="segment"
        [pressed]="choice === character()"
        [attr.data-character-choice]="choice"
        (click)="characterPicked.emit(choice)"
      >
        {{ t('characters.' + choice) }}
      </button>
    }
  </rs-pill-group>
</ng-container>
