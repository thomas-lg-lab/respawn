[project]
name = "respawn"
version = "0.0.0"
description = "Self-hosted game library: stats, backlog and next-game suggestions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
# Single source of truth for the dependency ranges. requirements.txt and requirements-dev.txt are compiled from
# here by scripts/compile-deps.sh; the image and the CI install the compiled files.
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.38,<1",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pwdlib[argon2]>=0.3,<1",
    "joserfc>=1.8,<2",
    "httpx>=0.28,<1",
    "slowapi>=0.1.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fixed test passwords and a throwaway local database.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["respawn"]
strict = true

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true
